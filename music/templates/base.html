<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MkMusic</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #121212;
            color: #fff;
            background: #000;
            transition: background 0.3s, color 0.3s;
            animation: fadeIn 0.8s ease-out;
        }

        .navbar, .footer {
            background-color: #1f1f1f;
        }

        .nav-link, .navbar-brand {
            color: #fff !important;
        }

        .nav-link:hover {
            color: #00bcd4 !important;
        }

        .footer {
            padding: 1rem 0;
            text-align: center;
            margin-top: 3rem;
        }

        body.light-mode {
            background: #fff;
            color: #000;
        }

        .floating-logo {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #00f260, #0575e6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: Gabriola, cursive;
            animation: glow 2s infinite alternate ease-in-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            0% { text-shadow: 0 0 5px #00f260, 0 0 10px #0575e6; }
            50% { text-shadow: 0 0 15px #00f260, 0 0 20px #0575e6; }
            100% { text-shadow: 0 0 5px #00f260, 0 0 10px #0575e6; }
        }
    </style>

    <!-- Optional: AdSense script (you'll get your own later) -->
    <!--
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js" crossorigin="anonymous"></script>
    -->
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg shadow-sm bg-dark">
        <div class="container position-relative">
            <div class="position-absolute top-50 start-50 translate-middle">
                <div class="floating-logo text-white fw-bold fs-9">
                    <a class="nav-link text-white" href="{% url 'home' %}">🎵 MkMusic</a>
                </div>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'home' %}">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content with Side Ads -->
    <main class="container mt-5">
        <div class="row">
            <!-- Left Ad -->
            <div class="col-md-2 d-none d-md-block">
                <div class="bg-dark text-white text-center p-2 rounded small">
                    <p>Ad</p>
                    <img src="https://via.placeholder.com/120x600" class="img-fluid" alt="Left Ad">
                </div>
            </div>

            <!-- Main Section -->
            <div class="col-md-8">
                {% block content %}
                {% endblock %}
            </div>

            <!-- Right Ad -->
            <div class="col-md-2 d-none d-md-block">
                <div class="bg-dark text-white text-center p-2 rounded small">
                    <p>Ad</p>
                    <img src="https://via.placeholder.com/120x600" class="img-fluid" alt="Right Ad">
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer text-center py-4 mt-5" style="background-color: #111;">
    <p class="text-white mb-1">&copy; 2025 MkMusic - All Rights Reserved</p>
    <p class="text-white">
        <a href="{% url 'terms' %}" class="text-white">Terms of Service</a> |
        <a href="{% url 'privacy' %}" class="text-white">Privacy Policy</a>
    </p>
        <p style="color: white">Kenya, Nairobi</p>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
