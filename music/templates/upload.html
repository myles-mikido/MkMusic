<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Song - MkMusic</title>
    <link rel="stylesheet" href="{% static 'music/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <h2 class="text-center mb-4">Upload New Song</h2>
        <form method="POST" enctype="multipart/form-data" class="bg-secondary p-4 rounded">
            {% csrf_token %}
            <div class="mb-3">
                <label for="title" class="form-label">Song Title</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>

            <div class="mb-3">
                <label for="artist" class="form-label">Artist</label>
                <input type="text" class="form-control" id="artist" name="artist" required>
            </div>

            <div class="mb-3">
                <label for="" class="form-label">Genre</label>
                <select class="form-select" name="genre" required>
                    <option selected disabled>Select Genre</option>
                    <option value="Hip Hop">Hip Hop</option>
                    <option value="Trap">Trap</option>
                    <option value="Afrobeats">Afrobeats</option>
                    <option value="R&B">R&B</option>
                    <option value="Pop">Pop</option>
                    <option value="Rock">Rock</option>
                    <option value="Gospel">Gospel</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="cover" class="form-label">Cover Image</label>
                <input type="file" class="form-control" id="cover" name="cover" accept="image/*" required>
            </div>

            <div class="mb-3">
                <label for="audio_file" class="form-label">Audio File</label>
                <input type="file" class="form-control" id="audio_file" name="audio_file" accept="audio/*" required>
            </div>

            <button type="submit" class="btn btn-success w-100">Upload Song</button>
        </form>
    </div>
</body>
</html>
